[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eduvijna-paper-evaluation-api"
version = "0.1.0"
description = "EduVijna Paper Evaluation API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=10.4,<12",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT[crypto]>=2.9,<3",
  "PyMuPDF>=1.24,<2",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24,<27",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.40,<2",
  "sympy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-boto3>=1.0.2,<2",
  "types-redis>=4.6.0.20241004",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["database/migrations"]

[[tool.mypy.overrides]]
module = ["celery.*", "fitz.*", "boto3.*", "botocore.*", "openai.*", "sympy.*"]
ignore_missing_imports = true
