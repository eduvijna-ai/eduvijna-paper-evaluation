name: eduvijna-paper-evaluation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduvijna}
      POSTGRES_USER: ${POSTGRES_USER:-eduvijna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduvijna_local_dev_only}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eduvijna_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eduvijna_minio_dev_only}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-eduvijna-paper-evaluation}
      APP_ENV: ${APP_ENV:-local}
      API_VERSION: ${API_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-local-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-eduvijna_local_jwt_dev_only_change_me}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      AUTH_ALGORITHM: ${AUTH_ALGORITHM:-HS256}
      STUDENT_IMPORT_MAX_BYTES: ${STUDENT_IMPORT_MAX_BYTES:-2000000}
      STUDENT_IMPORT_MAX_ROWS: ${STUDENT_IMPORT_MAX_ROWS:-5000}
      # In-container service DNS — do not interpolate host .env (127.0.0.1 publish ports).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eduvijna}:${POSTGRES_PASSWORD:-eduvijna_local_dev_only}@postgres:5432/${POSTGRES_DB:-eduvijna}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-eduvijna_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-eduvijna_minio_dev_only}
      S3_BUCKET: ${S3_BUCKET:-eduvijna-papers}
      S3_REGION: ${S3_REGION:-us-east-1}
      SUBMISSION_UPLOAD_MAX_BYTES: ${SUBMISSION_UPLOAD_MAX_BYTES:-52428800}
      SUBMISSION_MAX_PAGES: ${SUBMISSION_MAX_PAGES:-100}
      AI_PROVIDER_VISION: ${AI_PROVIDER_VISION:-none}
      AI_PROVIDER_TEXT: ${AI_PROVIDER_TEXT:-none}
      AI_PROVIDER_AUTHORING: ${AI_PROVIDER_AUTHORING:-none}
      UPLOAD_SCANNER: ${UPLOAD_SCANNER:-none}
      AI_MODEL_IDENTITY: ${AI_MODEL_IDENTITY:-gpt-4o-mini}
      AI_MODEL_PAGE_ANALYSIS: ${AI_MODEL_PAGE_ANALYSIS:-gpt-4o-mini}
      AI_MODEL_MAPPING: ${AI_MODEL_MAPPING:-gpt-4o-mini}
      AI_MODEL_TRANSCRIPTION: ${AI_MODEL_TRANSCRIPTION:-gpt-4o-mini}
      AI_MODEL_QUESTION_PAPER_PARSE: ${AI_MODEL_QUESTION_PAPER_PARSE:-gpt-4o-mini}
      AI_MODEL_ANSWER_KEY_PROPOSAL: ${AI_MODEL_ANSWER_KEY_PROPOSAL:-gpt-4o-mini}
      AI_MODEL_RUBRIC_PROPOSAL: ${AI_MODEL_RUBRIC_PROPOSAL:-gpt-4o-mini}
      AI_MODEL_CURRICULUM_MAPPING_PROPOSAL: ${AI_MODEL_CURRICULUM_MAPPING_PROPOSAL:-gpt-4o-mini}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PUBLISH_PORT:-18000}:8000"
    volumes:
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
      - ./database:/database:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-eduvijna-paper-evaluation}
      APP_ENV: ${APP_ENV:-local}
      API_VERSION: ${API_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-local-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-eduvijna_local_jwt_dev_only_change_me}
      # In-container service DNS — do not interpolate host .env (127.0.0.1 publish ports).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eduvijna}:${POSTGRES_PASSWORD:-eduvijna_local_dev_only}@postgres:5432/${POSTGRES_DB:-eduvijna}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-eduvijna_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-eduvijna_minio_dev_only}
      S3_BUCKET: ${S3_BUCKET:-eduvijna-papers}
      S3_REGION: ${S3_REGION:-us-east-1}
      SUBMISSION_UPLOAD_MAX_BYTES: ${SUBMISSION_UPLOAD_MAX_BYTES:-52428800}
      SUBMISSION_MAX_PAGES: ${SUBMISSION_MAX_PAGES:-100}
      AI_PROVIDER_VISION: ${AI_PROVIDER_VISION:-none}
      AI_PROVIDER_TEXT: ${AI_PROVIDER_TEXT:-none}
      AI_PROVIDER_AUTHORING: ${AI_PROVIDER_AUTHORING:-none}
      UPLOAD_SCANNER: ${UPLOAD_SCANNER:-none}
      AI_MODEL_IDENTITY: ${AI_MODEL_IDENTITY:-gpt-4o-mini}
      AI_MODEL_PAGE_ANALYSIS: ${AI_MODEL_PAGE_ANALYSIS:-gpt-4o-mini}
      AI_MODEL_MAPPING: ${AI_MODEL_MAPPING:-gpt-4o-mini}
      AI_MODEL_TRANSCRIPTION: ${AI_MODEL_TRANSCRIPTION:-gpt-4o-mini}
      AI_MODEL_QUESTION_PAPER_PARSE: ${AI_MODEL_QUESTION_PAPER_PARSE:-gpt-4o-mini}
      AI_MODEL_ANSWER_KEY_PROPOSAL: ${AI_MODEL_ANSWER_KEY_PROPOSAL:-gpt-4o-mini}
      AI_MODEL_RUBRIC_PROPOSAL: ${AI_MODEL_RUBRIC_PROPOSAL:-gpt-4o-mini}
      AI_MODEL_CURRICULUM_MAPPING_PROPOSAL: ${AI_MODEL_CURRICULUM_MAPPING_PROPOSAL:-gpt-4o-mini}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
      - ./database:/database:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
