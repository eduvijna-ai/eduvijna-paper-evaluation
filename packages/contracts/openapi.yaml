                $ref: "#/components/schemas/Submission"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/identity/unmatched:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: markIdentityUnmatched
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Identity marked unmatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/mapping/prepare:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: prepareMappingReview
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Mapping preparation enqueued / completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/mapping:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMappingWorkspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Live mapping workspace for the bound assessment version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingWorkspace" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/mapping/finalize:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: finalizeMappingReview
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Mapping complete — READY_FOR_EVALUATION
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submission-pages/{id}/answer-regions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: createAnswerRegion
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRegionInput" }
      responses:
        "201":
          description: Answer region created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerRegion" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/answer-regions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateAnswerRegion
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRegionPatch" }
      responses:
        "200":
          description: Answer region updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerRegion" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAnswerRegion
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Answer region deleted
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submission-pages/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateSubmissionPage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionPagePatch" }
      responses:
        "200":
          description: Submission page updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/question-mappings/{questionVersionId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: questionVersionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: upsertQuestionMapping
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionMappingInput" }
      responses:
        "200":
          description: Question mapping upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAnswerMapping" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/question-mappings/{questionVersionId}/confirm:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: questionVersionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmQuestionMapping
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Question mapping confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAnswerMapping" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Resource not found, including cross-tenant access
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    VersionResponse:
      type: object
      additionalProperties: false
      required: [application, environment, git_sha, api_version]
      properties:
        application:
          type: string
        environment:
          type: string
        git_sha:
          type: string
        api_version:
          type: string
    ErrorEnvelope:
      $ref: "./schemas/error.schema.json"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        tenant_slug: { type: [string, "null"] }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, tenant_id, email, display_name, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    Institution:
      type: object
      required: [id, tenant_id, code, name]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    AcademicYearInput:
      type: object
      required: [name, starts_on, ends_on]
      properties:
        name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        is_current: { type: boolean, default: false }
    AcademicYear:
      allOf:
        - { $ref: "#/components/schemas/AcademicYearInput" }
        - { type: object, required: [id, tenant_id, institution_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid }, institution_id: { type: string, format: uuid } } }
    ClassSectionInput:
      type: object
      required: [academic_year_id, name, grade_label]
      properties:
        academic_year_id: { type: string, format: uuid }
        name: { type: string }
        grade_label: { type: string }
    ClassSection:
      allOf:
        - { $ref: "#/components/schemas/ClassSectionInput" }
        - { type: object, required: [id, tenant_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid } } }
    StudentInput:
      type: object
      required: [student_code, full_name]
      properties:
        student_code: { type: string }
        admission_number: { type: [string, "null"] }
        roll_number: { type: [string, "null"] }
        full_name: { type: string }
        class_section_id: { type: [string, "null"], format: uuid }
        academic_year_id: { type: [string, "null"], format: uuid }
        status: { type: string, default: active }
    Student:
      allOf:
        - { $ref: "#/components/schemas/StudentInput" }
        - { type: object, required: [id, tenant_id, created_at, updated_at], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    GuardianInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
    Guardian:
      allOf:
        - { $ref: "#/components/schemas/GuardianInput" }
        - { type: object, required: [id, tenant_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid } } }
    ImportValidation:
      type: object
      required: [import_session_id, status, valid_row_count, row_results, expires_at]
      properties:
        import_session_id: { type: string, format: uuid }
        status: { type: string, enum: [VALIDATED] }
        valid_row_count: { type: integer }
        row_results:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowResult"
        expires_at: { type: string, format: date-time }
    ImportRowResult:
      type: object
      required: [row, outcome, data]
      properties:
        row: { type: integer }
        outcome:
          type: string
          enum:
            - VALID
            - DUPLICATE_IN_FILE
            - DUPLICATE_EXISTING
            - INVALID
            - UNKNOWN_CLASS
            - MISSING_REQUIRED_FIELD
        reason_code:
          type: string
          enum:
            - STUDENT_CODE_DUPLICATE_EXISTING
            - CLASS_ROLL_DUPLICATE_EXISTING
            - STUDENT_CODE_DUPLICATE_IN_FILE
            - CLASS_ROLL_DUPLICATE_IN_FILE
        data:
          type: object
          additionalProperties: { type: string }
        academic_year_id: { type: [string, "null"], format: uuid }
        class_section_id: { type: [string, "null"], format: uuid }
    ImportCommit:
      type: object
      required: [import_session_id, status, committed_count]
      properties:
        import_session_id: { type: string, format: uuid }
        status: { type: string }
        committed_count: { type: integer }
    StudentGuardianLink:
      type: object
      required: [student_id, guardian_id, display_name, relationship_type]
      properties:
        student_id: { type: string, format: uuid }
        guardian_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        relationship_type: { type: string }
    Money:
      type: string
      pattern: '^\d{1,8}(\.\d{1,2})?$'
      examples: ["10.00"]
    CurriculumInput:
      type: object
      required: [code, name, version_label]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        academic_framework: { type: [string, "null"] }
        version_label: { type: string }
        status: { type: string, default: active }
    Curriculum:
      allOf:
        - { $ref: "#/components/schemas/CurriculumInput" }
        - { type: object, required: [id, tenant_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid } } }
    CurriculumNodeInput:
      type: object
      required: [node_type, code, name]
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        node_type: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        sequence: { type: integer, default: 0 }
        metadata: { type: object, additionalProperties: true }
        status: { type: string, default: active }
    CurriculumNode:
      allOf:
        - { $ref: "#/components/schemas/CurriculumNodeInput" }
        - { type: object, required: [id, tenant_id, curriculum_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid }, curriculum_id: { type: string, format: uuid }, children: { type: array, items: { $ref: "#/components/schemas/CurriculumNode" } } } }
    PrerequisiteInput:
      type: object
      required: [prerequisite_node_id, dependent_node_id, relationship_type]
      properties:
        prerequisite_node_id: { type: string, format: uuid }
        dependent_node_id: { type: string, format: uuid }
        relationship_type: { type: string, enum: [REQUIRED, RECOMMENDED] }
    AssessmentInput:
      type: object
      required: [curriculum_id, code, title, assessment_type, max_marks]
      properties:
        curriculum_id: { type: string, format: uuid }
        subject_node_id: { type: [string, "null"], format: uuid }
        academic_year_id: { type: [string, "null"], format: uuid }
        class_section_id: { type: [string, "null"], format: uuid }
        code: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        assessment_type: { type: string }
        max_marks: { $ref: "#/components/schemas/Money" }
        duration_minutes: { type: [integer, "null"] }
    Assessment:
      allOf:
        - { $ref: "#/components/schemas/AssessmentInput" }
        - { type: object, required: [id, tenant_id, status], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid }, status: { type: string } } }
    AssessmentVersionInput:
      type: object
      required: [title, max_marks]
      properties:
        title: { type: string }
        instructions: { type: [string, "null"] }
        max_marks: { $ref: "#/components/schemas/Money" }
        question_paper_artifact_id: { type: [string, "null"], format: uuid }
    QuestionInput:
      type: object
      required: [stable_code, display_label, sequence, prompt_text, max_marks, question_type, scoring_mode]
      properties:
        stable_code: { type: string }
        parent_question_version_id: { type: [string, "null"], format: uuid }
        display_label: { type: string }
        sequence: { type: integer }
        prompt_text: { type: string }
        max_marks: { $ref: "#/components/schemas/Money" }
        question_type: { type: string }
        scoring_mode: { type: string, enum: [LEAF_SCORABLE, CONTAINER_DERIVED] }
        instructions: { type: [string, "null"] }
    AnswerKeyVersionInput:
      type: object
      required: [assessment_version_id, question_version_id, answer_text, source_type]
      properties:
        assessment_version_id: { type: string, format: uuid }
        question_version_id: { type: string, format: uuid }
        answer_text: { type: string }
        structured_answer: { type: [object, "null"], additionalProperties: true }
        source_type: { type: string, enum: [TEACHER, IMPORTED], description: AI_PROPOSED is server-assigned by proposal flow only }
        status: { type: string, enum: [DRAFT, REVIEW_REQUIRED], default: DRAFT }
    RubricInput:
      type: object
      required: [question_version_id, title]
      properties:
        question_version_id: { type: string, format: uuid }
        title: { type: string }
        provenance: { type: string, default: TEACHER }
    RubricVersionInput:
      type: object
      required: [question_version_id]
      properties:
        question_version_id: { type: string, format: uuid }
        source_type: { type: string, enum: [TEACHER, IMPORTED], default: TEACHER }
        status: { type: string, enum: [DRAFT, REVIEW_REQUIRED], default: DRAFT }
    RubricVersion:
      type: object
      required:
        [
          id,
          tenant_id,
          rubric_id,
          question_version_id,
          version_number,
          status,
          source_type,
          created_by,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        rubric_id: { type: string, format: uuid }
        question_version_id: { type: string, format: uuid }
        version_number: { type: integer }
        status: { type: string, enum: [DRAFT, REVIEW_REQUIRED, APPROVED, SUPERSEDED] }
        source_type: { type: string }
        created_by: { type: string, format: uuid }
        approved_by: { type: [string, "null"], format: uuid }
        approved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RubricCriterionInput:
      type: object
      required: [criterion_code, description, max_marks, sequence, scoring_mode]
      properties:
        criterion_code: { type: string }
        description: { type: string }
        max_marks: { $ref: "#/components/schemas/Money" }
        sequence: { type: integer }
        scoring_mode: { type: string, enum: [ADDITIVE, DEDUCTIVE, ALL_OR_NOTHING] }
        partial_credit_allowed: { type: boolean, default: false }
        dependency_rule: { type: [object, "null"], additionalProperties: true }
        ecf_policy: { type: string, enum: [NONE, ALLOW_METHOD_CREDIT, CUSTOM_REVIEW] }
        unit_requirement: { type: [string, "null"] }
        precision_requirement: { type: [string, "null"] }
        required_reasoning: { type: [string, "null"] }
        accepted_equivalents: { type: array, items: {} }
        teacher_comment: { type: [string, "null"] }
    CurriculumMappingInput:
      type: object
      required: [curriculum_node_id, mapping_type]
      properties:
        curriculum_node_id: { type: string, format: uuid }
        mapping_type: { type: string, enum: [PRIMARY, SECONDARY, LEARNING_OUTCOME, SKILL] }
        weight: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
    AnswerKeyVersionPatch:
      type: object
      properties:
        answer_text: { type: string }
        structured_answer: { type: [object, "null"], additionalProperties: true }
        status: { type: string, enum: [DRAFT, REVIEW_REQUIRED] }
    RubricCriterionPatch:
      type: object
      properties:
        description: { type: string }
        max_marks: { $ref: "#/components/schemas/Money" }
        sequence: { type: integer }
        scoring_mode: { type: string, enum: [ADDITIVE, DEDUCTIVE, ALL_OR_NOTHING] }
        partial_credit_allowed: { type: boolean }
        dependency_rule: { type: [object, "null"], additionalProperties: true }
        ecf_policy: { type: string, enum: [NONE, ALLOW_METHOD_CREDIT, CUSTOM_REVIEW] }
        unit_requirement: { type: [string, "null"] }
        precision_requirement: { type: [string, "null"] }
        required_reasoning: { type: [string, "null"] }
        accepted_equivalents: { type: array, items: {} }
        teacher_comment: { type: [string, "null"] }
    RubricVersionPatch:
      type: object
      required: [question_version_id]
      properties:
        question_version_id: { type: string, format: uuid }
        source_type: { type: string, enum: [TEACHER, IMPORTED] }
        status: { type: string, enum: [DRAFT, REVIEW_REQUIRED], default: DRAFT }
    AcademicYearPatch:
      type: object
      properties:
        name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        is_current: { type: boolean }
    ClassSectionPatch:
      type: object
      properties:
        academic_year_id: { type: string, format: uuid }
        name: { type: string }
        grade_label: { type: string }
    StudentPatch:
      type: object
      properties:
        student_code: { type: string }
        admission_number: { type: [string, "null"] }
        roll_number: { type: [string, "null"] }
        full_name: { type: string }
        class_section_id: { type: [string, "null"], format: uuid }
        academic_year_id: { type: [string, "null"], format: uuid }
        status: { type: string }
    GuardianPatch:
      type: object
      properties:
        display_name: { type: string }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
    CurriculumPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        academic_framework: { type: [string, "null"] }
        version_label: { type: string }
        status: { type: string }
    CurriculumNodePatch:
      type: object
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        node_type: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        sequence: { type: integer }
        metadata: { type: object, additionalProperties: true }
        status: { type: string }
    AssessmentPatch:
      type: object
      properties:
        title: { type: string }
        description: { type: [string, "null"] }
        assessment_type: { type: string }
        max_marks: { $ref: "#/components/schemas/Money" }
        duration_minutes: { type: [integer, "null"] }
    QuestionVersionPatch:
      type: object
      properties:
        parent_question_version_id: { type: [string, "null"], format: uuid }
        display_label: { type: string }
        sequence: { type: integer }
        prompt_text: { type: string }
        max_marks: { $ref: "#/components/schemas/Money" }
        question_type: { type: string }
        scoring_mode: { type: string, enum: [LEAF_SCORABLE, CONTAINER_DERIVED] }
        instructions: { type: [string, "null"] }
    AnswerKeyProposalRequest:
      type: object
      additionalProperties: false
      required: [question_version_id]
      properties:
        question_version_id: { type: string, format: uuid }
        assessment_version_id: { type: [string, "null"], format: uuid }
        instructions: { type: [string, "null"], maxLength: 500 }
        context:
          type: object
          additionalProperties: { type: string }
          maxProperties: 20
    RubricProposalRequest:
      type: object
      additionalProperties: false
      required: [question_version_id]
      properties:
        question_version_id: { type: string, format: uuid }
