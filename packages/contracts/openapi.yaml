openapi: 3.1.0
info:
  title: EduVijna Paper Evaluation API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /ready:
    get:
      operationId: ready
      summary: Dependency readiness check
      responses:
        "200":
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/system/version:
    get:
      operationId: systemVersion
      summary: Build and API version
      responses:
        "200":
          description: Current application version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user and authorization context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /api/v1/institution:
    get:
      operationId: currentInstitution
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tenant primary institution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Institution" }
  /api/v1/academic-years:
    get:
      operationId: listAcademicYears
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Academic years
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AcademicYear" } }
    post:
      operationId: createAcademicYear
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicYearInput" }
      responses:
        "201":
          description: Created academic year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicYear" }
  /api/v1/academic-years/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getAcademicYear
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Academic year, content: { application/json: { schema: { $ref: "#/components/schemas/AcademicYear" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAcademicYear
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AcademicYearPatch" } } } }
      responses:
        "200": { description: Updated academic year, content: { application/json: { schema: { $ref: "#/components/schemas/AcademicYear" } } } }
  /api/v1/class-sections:
    get:
      operationId: listClassSections
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Class sections, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ClassSection" } } } } }
    post:
      operationId: createClassSection
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClassSectionInput" } } } }
      responses:
        "201": { description: Created class section, content: { application/json: { schema: { $ref: "#/components/schemas/ClassSection" } } } }
  /api/v1/class-sections/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getClassSection
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Class section, content: { application/json: { schema: { $ref: "#/components/schemas/ClassSection" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateClassSection
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClassSectionPatch" } } } }
      responses:
        "200": { description: Updated class section, content: { application/json: { schema: { $ref: "#/components/schemas/ClassSection" } } } }
  /api/v1/students:
    get:
      operationId: listStudents
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Students, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Student" } } } } }
    post:
      operationId: createStudent
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StudentInput" } } } }
      responses:
        "201": { description: Created student, content: { application/json: { schema: { $ref: "#/components/schemas/Student" } } } }
  /api/v1/students/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getStudent
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Student, content: { application/json: { schema: { $ref: "#/components/schemas/Student" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateStudent
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StudentPatch" } } } }
      responses:
        "200": { description: Updated student, content: { application/json: { schema: { $ref: "#/components/schemas/Student" } } } }
  /api/v1/students/import/validate:
    post:
      operationId: validateStudentImport
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "200": { description: Per-row validation without student writes, content: { application/json: { schema: { $ref: "#/components/schemas/ImportValidation" } } } }
  /api/v1/students/import/commit:
    post:
      operationId: commitStudentImport
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [import_session_id]
              properties: { import_session_id: { type: string, format: uuid } }
      responses:
        "200":
          description: Import commit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommit"
        "409":
          description: Session expired/invalid or roster conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/guardians:
    get:
      operationId: listGuardians
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Guardians, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Guardian" } } } } }
    post:
      operationId: createGuardian
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GuardianInput" } } } }
      responses:
        "201": { description: Created guardian, content: { application/json: { schema: { $ref: "#/components/schemas/Guardian" } } } }
  /api/v1/guardians/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getGuardian
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Guardian, content: { application/json: { schema: { $ref: "#/components/schemas/Guardian" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateGuardian
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GuardianPatch" } } } }
      responses:
        "200": { description: Updated guardian, content: { application/json: { schema: { $ref: "#/components/schemas/Guardian" } } } }
  /api/v1/students/{student_id}/guardians:
    parameters:
      - { name: student_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listStudentGuardians
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Guardians linked to the student
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentGuardianLink"
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/students/{student_id}/guardians/{guardian_id}:
    parameters:
      - { name: student_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: guardian_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: linkStudentGuardian
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relationship_type]
              properties: { relationship_type: { type: string } }
      responses:
        "201": { description: Guardian linked }
    delete:
      operationId: unlinkStudentGuardian
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Guardian unlinked }
  /api/v1/curricula:
    get:
      operationId: listCurricula
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Tenant curricula, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Curriculum" } } } } }
    post:
      operationId: createCurriculum
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CurriculumInput" } } } }
      responses:
        "201": { description: Curriculum created, content: { application/json: { schema: { $ref: "#/components/schemas/Curriculum" } } } }
  /api/v1/curricula/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getCurriculum
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Curriculum, content: { application/json: { schema: { $ref: "#/components/schemas/Curriculum" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
    patch:
      operationId: updateCurriculum
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CurriculumPatch" } } } }
      responses: { "200": { description: Curriculum updated } }
  /api/v1/curricula/{id}/tree:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getCurriculumTree
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Ordered curriculum tree, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CurriculumNode" } } } } } }
  /api/v1/curricula/{id}/nodes:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: createCurriculumNode
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CurriculumNodeInput" } } } }
      responses: { "201": { description: Curriculum node created }, "409": { description: Duplicate or cyclic node } }
  /api/v1/curriculum-nodes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateCurriculumNode
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CurriculumNodePatch" } } } }
      responses: { "200": { description: Curriculum node updated }, "409": { description: Parent cycle } }
  /api/v1/curricula/{id}/prerequisites:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: createCurriculumPrerequisite
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PrerequisiteInput" } } } }
      responses: { "201": { description: Prerequisite created }, "409": { description: Prerequisite cycle } }
  /api/v1/curriculum-prerequisites/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: deleteCurriculumPrerequisite
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Prerequisite deleted } }
  /api/v1/assessments:
    get:
      operationId: listAssessments
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Tenant assessments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Assessment" } } } } } }
    post:
      operationId: createAssessment
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssessmentInput" } } } }
      responses: { "201": { description: Assessment and initial version created } }
  /api/v1/assessments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getAssessment
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Assessment, content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } } } }
    patch:
      operationId: updateAssessment
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssessmentPatch" } } } }
      responses: { "200": { description: DRAFT assessment updated }, "409": { description: Assessment immutable in current state } }
  /api/v1/assessments/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listAssessmentVersions
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Assessment versions } }
    post:
      operationId: createAssessmentVersion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssessmentVersionInput" } } } }
      responses: { "201": { description: Assessment version created } }
  /api/v1/assessments/{id}/transition:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: transitionAssessment
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to_status], properties: { to_status: { type: string, enum: [DRAFT, RUBRIC_REVIEW, READY, ACTIVE, CLOSED, ARCHIVED] } } } } } }
      responses: { "200": { description: Assessment transitioned }, "409": { description: Invalid transition or readiness failure } }
  /api/v1/assessment-versions/{id}/questions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getQuestionTree
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Ordered question tree } }
    post:
      operationId: createQuestionVersion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionInput" } } } }
      responses: { "201": { description: Question version created } }
  /api/v1/question-versions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateQuestionVersion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionVersionPatch" } } } }
      responses: { "200": { description: Question version updated }, "409": { description: Not editable or cyclic } }
    delete:
      operationId: deleteQuestionVersion
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: DRAFT question deleted }, "409": { description: Question not editable } }
  /api/v1/assessment-versions/{id}/marks/reconcile:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: reconcileAssessmentMarks
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Leaf-only mark reconciliation } }
  /api/v1/assessments/{id}/answer-key-versions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listAnswerKeyVersions
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Answer key versions } }
    post:
      operationId: createAnswerKeyVersion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AnswerKeyVersionInput" } } } }
      responses: { "201": { description: Answer key version created } }
  /api/v1/answer-key-versions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateAnswerKeyVersion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AnswerKeyVersionPatch" } } } }
      responses: { "200": { description: Draft answer key updated }, "409": { description: Approved version immutable } }
  /api/v1/answer-key-versions/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: approveAnswerKeyVersion
      description: Requires assessment:approve.
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Answer key approved }, "409": { description: Version cannot be approved } }
  /api/v1/assessments/{id}/rubrics:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listRubrics
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Assessment rubrics } }
    post:
      operationId: createRubric
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubricInput"
      responses: { "201": { description: Rubric created } }
  /api/v1/rubrics/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listRubricVersions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Rubric versions ordered by version number }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createRubricVersion
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubricVersionInput"
      responses: { "201": { description: Rubric version created } }
  /api/v1/rubric-versions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateRubricVersion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RubricVersionPatch" } } } }
      responses: { "200": { description: Draft rubric updated }, "409": { description: Approved version immutable } }
  /api/v1/rubric-versions/{id}/criteria:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listRubricCriteria
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Rubric criteria } }
    post:
      operationId: createRubricCriterion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RubricCriterionInput" } } } }
      responses: { "201": { description: Criterion created } }
  /api/v1/rubric-versions/{id}/reconcile:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: reconcileRubric
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Rubric mark reconciliation } }
  /api/v1/rubric-criteria/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateRubricCriterion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RubricCriterionPatch" } } } }
      responses: { "200": { description: Draft criterion updated }, "409": { description: Approved rubric immutable } }
    delete:
      operationId: deleteRubricCriterion
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Draft criterion deleted }, "409": { description: Approved rubric immutable } }
  /api/v1/rubric-versions/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: approveRubricVersion
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Rubric approved }, "409": { description: Reconciliation failure } }
  /api/v1/question-versions/{id}/curriculum-mappings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listQuestionCurriculumMappings
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Curriculum mappings } }
    post:
      operationId: createQuestionCurriculumMapping
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CurriculumMappingInput" } } } }
      responses: { "201": { description: Mapping created } }
  /api/v1/question-curriculum-mappings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: deleteQuestionCurriculumMapping
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Mapping deleted } }
  /api/v1/ai/proposals/answer-key:
    post:
      operationId: proposeAnswerKey
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AnswerKeyProposalRequest" } } } }
      responses: { "503": { description: AI provider unavailable; no content fabricated } }
  /api/v1/ai/proposals/rubric:
    post:
      operationId: proposeRubric
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RubricProposalRequest" } } } }
      responses: { "503": { description: AI provider unavailable; no content fabricated } }
  /api/v1/ai/proposals/curriculum-mapping:
    post:
      operationId: suggestCurriculumMapping
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CurriculumMappingProposalRequest" } } } }
      responses: { "503": { description: AI provider unavailable; no content fabricated } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Resource not found, including cross-tenant access
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    VersionResponse:
      type: object
      additionalProperties: false
      required: [application, environment, git_sha, api_version]
      properties:
        application:
          type: string
        environment:
          type: string
        git_sha:
          type: string
        api_version:
          type: string
    ErrorEnvelope:
      $ref: "./schemas/error.schema.json"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        tenant_slug: { type: [string, "null"] }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, tenant_id, email, display_name, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    Institution:
