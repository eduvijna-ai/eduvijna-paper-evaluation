      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionPagePatch" }
      responses:
        "200":
          description: Submission page updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/question-mappings/{questionVersionId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: questionVersionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: upsertQuestionMapping
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionMappingInput" }
      responses:
        "200":
          description: Question mapping upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAnswerMapping" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/question-mappings/{questionVersionId}/confirm:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: questionVersionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmQuestionMapping
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Question mapping confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAnswerMapping" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Resource not found, including cross-tenant access
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    VersionResponse:
      type: object
      additionalProperties: false
      required: [application, environment, git_sha, api_version]
      properties:
        application:
          type: string
        environment:
          type: string
        git_sha:
          type: string
        api_version:
          type: string
    ErrorEnvelope:
      $ref: "./schemas/error.schema.json"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        tenant_slug: { type: [string, "null"] }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, tenant_id, email, display_name, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    Institution:
      type: object
      required: [id, tenant_id, code, name]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    AcademicYearInput:
      type: object
      required: [name, starts_on, ends_on]
      properties:
        name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        is_current: { type: boolean, default: false }
    AcademicYear:
      allOf:
        - { $ref: "#/components/schemas/AcademicYearInput" }
        - { type: object, required: [id, tenant_id, institution_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid }, institution_id: { type: string, format: uuid } } }
    ClassSectionInput:
      type: object
      required: [academic_year_id, name, grade_label]
      properties:
        academic_year_id: { type: string, format: uuid }
        name: { type: string }
        grade_label: { type: string }
    ClassSection:
      allOf:
        - { $ref: "#/components/schemas/ClassSectionInput" }
        - { type: object, required: [id, tenant_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid } } }
    StudentInput:
      type: object
      required: [student_code, full_name]
      properties:
        student_code: { type: string }
        admission_number: { type: [string, "null"] }
        roll_number: { type: [string, "null"] }
        full_name: { type: string }
        class_section_id: { type: [string, "null"], format: uuid }
        academic_year_id: { type: [string, "null"], format: uuid }
        status: { type: string, default: active }
    Student:
      allOf:
        - { $ref: "#/components/schemas/StudentInput" }
        - { type: object, required: [id, tenant_id, created_at, updated_at], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    GuardianInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
    Guardian:
      allOf:
        - { $ref: "#/components/schemas/GuardianInput" }
        - { type: object, required: [id, tenant_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid } } }
    ImportValidation:
      type: object
      required: [import_session_id, status, valid_row_count, row_results, expires_at]
      properties:
        import_session_id: { type: string, format: uuid }
        status: { type: string, enum: [VALIDATED] }
        valid_row_count: { type: integer }
        row_results:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowResult"
        expires_at: { type: string, format: date-time }
    ImportRowResult:
      type: object
      required: [row, outcome, data]
      properties:
        row: { type: integer }
        outcome:
          type: string
          enum:
            - VALID
            - DUPLICATE_IN_FILE
            - DUPLICATE_EXISTING
            - INVALID
            - UNKNOWN_CLASS
            - MISSING_REQUIRED_FIELD
        reason_code:
          type: string
          enum:
            - STUDENT_CODE_DUPLICATE_EXISTING
            - CLASS_ROLL_DUPLICATE_EXISTING
            - STUDENT_CODE_DUPLICATE_IN_FILE
            - CLASS_ROLL_DUPLICATE_IN_FILE
        data:
          type: object
          additionalProperties: { type: string }
        academic_year_id: { type: [string, "null"], format: uuid }
        class_section_id: { type: [string, "null"], format: uuid }
    ImportCommit:
      type: object
      required: [import_session_id, status, committed_count]
      properties:
        import_session_id: { type: string, format: uuid }
        status: { type: string }
        committed_count: { type: integer }
    StudentGuardianLink:
      type: object
      required: [student_id, guardian_id, display_name, relationship_type]
      properties:
        student_id: { type: string, format: uuid }
        guardian_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        relationship_type: { type: string }
    Money:
      type: string
      pattern: '^\d{1,8}(\.\d{1,2})?$'
      examples: ["10.00"]
    CurriculumInput:
      type: object
      required: [code, name, version_label]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        academic_framework: { type: [string, "null"] }
        version_label: { type: string }
        status: { type: string, default: active }
    Curriculum:
      allOf:
        - { $ref: "#/components/schemas/CurriculumInput" }
        - { type: object, required: [id, tenant_id], properties: { id: { type: string, format: uuid }, tenant_id: { type: string, format: uuid } } }
    CurriculumNodeInput:
      type: object
      required: [node_type, code, name]
