  /api/v1/submission-pages/{id}/image:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSubmissionPageImage
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Normalized page PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{id}/identity:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getIdentityReview
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Identity review payload with manual roster candidates
