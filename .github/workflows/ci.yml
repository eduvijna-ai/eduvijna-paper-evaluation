name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eduvijna
          POSTGRES_USER: eduvijna
          POSTGRES_PASSWORD: eduvijna_local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduvijna -d eduvijna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://eduvijna:eduvijna_local_dev_only@localhost:5432/eduvijna
      AUTH_TOKEN_SECRET: ci-only-secret-not-for-production
      APP_ENV: test
      S3_ENDPOINT_URL: http://127.0.0.1:19000
      S3_ACCESS_KEY: eduvijna_minio
      S3_SECRET_KEY: eduvijna_minio_dev_only
      S3_BUCKET: eduvijna-papers
      S3_REGION: us-east-1
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO for B3 storage tests
        working-directory: .
        run: |
          docker run -d --name minio-b3 \
            -p 19000:9000 \
            -e MINIO_ROOT_USER=eduvijna_minio \
            -e MINIO_ROOT_PASSWORD=eduvijna_minio_dev_only \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio-b3
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy app
      - name: Migrate database
        run: python -m alembic -c alembic.ini upgrade head
      - name: Test
        run: python -m pytest

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install validator
        run: npm ci
      - name: Validate schemas and OpenAPI
        run: npm run validate

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local defaults
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_MODE: mock

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright smoke
        run: pnpm test:e2e:mock
        env:
          NEXT_PUBLIC_API_MODE: mock

  frontend-e2e-real:
    name: Frontend E2E Real
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local defaults
        run: |
          cp .env.example .env
          echo "AI_PROVIDER_VISION=fixed" >> .env
          echo "AI_PROVIDER_TEXT=fixed" >> .env
          echo "AI_PROVIDER_AUTHORING=fixed" >> .env
          echo "UPLOAD_SCANNER=fixed" >> .env
      - name: Start real backend stack
        run: docker compose up -d --build postgres redis minio api worker
        env:
          AI_PROVIDER_VISION: fixed
          AI_PROVIDER_TEXT: fixed
          AI_PROVIDER_AUTHORING: fixed
          UPLOAD_SCANNER: fixed
      - name: Migrate real backend database
        run: docker compose exec -T api python -m alembic -c alembic.ini upgrade head
      - name: Seed deterministic demo data
        run: docker compose exec -T api python -m app.cli.seed_dev
      - name: Seed B17.1 deterministic quality cohort
        run: docker compose exec -T api python -m app.cli.seed_b17_e2e_quality
      - name: Wait for real backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color api
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run real-backend Playwright
        run: pnpm test:e2e:real
        working-directory: apps/web
        env:
          API_UPSTREAM_URL: http://127.0.0.1:18000
      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color api worker postgres redis minio
      - name: Stop real backend stack
        if: always()
        run: docker compose down -v --remove-orphans
